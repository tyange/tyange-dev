name: Deploy Static Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # forgejo-runner를 `--label self-hosted:host`로 띄웠다는 전제 — Docker 없이
    # 러너를 구동하는 서버에서 직접 실행된다(격리 없음). 라벨을 바꿨다면 여기도 맞출 것.
    runs-on: self-hosted
    environment: deploy on aws

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # design-system이 git+ssh 의존성이라 이 러너에 git.tyange.com용 SSH 키가
      # 필요하다. deploy key(읽기 전용)를 새로 만들어 DESIGN_SYSTEM_DEPLOY_KEY
      # secret으로 등록해 두는 걸 권장. 러너가 self-hosted:host(격리 없음)라
      # 이 서버에 이미 있을 수 있는 기본 키(~/.ssh/id_ed25519)를 절대 건드리지
      # 않도록 전용 파일명 + Host 블록으로 분리한다.
      - name: Set up SSH for git dependency
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}" > ~/.ssh/tyange_dev_ci_deploy_key
          # CRLF로 붙여넣어졌으면(웹 폼/에디터를 거치며 흔히 생김) OpenSSH가
          # "error in libcrypto"로 키 파싱 자체를 거부한다 — LF로 강제 정규화.
          sed -i 's/\r$//' ~/.ssh/tyange_dev_ci_deploy_key
          chmod 600 ~/.ssh/tyange_dev_ci_deploy_key
          ssh-keygen -y -f ~/.ssh/tyange_dev_ci_deploy_key > /dev/null \
            && echo "key OK" || echo "::error::DESIGN_SYSTEM_DEPLOY_KEY가 유효한 개인키가 아님"
          ssh-keyscan -H git.tyange.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'SSHCONFIG'
          Host git.tyange.com
            IdentityFile ~/.ssh/tyange_dev_ci_deploy_key
            IdentitiesOnly yes
          SSHCONFIG

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build
        env:
          CMS_API_BASE_URL: "${{ vars.CMS_API_BASE_URL || 'https://tyange.com/api/cms' }}"

      - name: Prepare deploy directory
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          script: |
            mkdir -p "${{ vars.DEPLOY_PATH }}"
            find "${{ vars.DEPLOY_PATH }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Deploy static files via SCP
        uses: https://github.com/appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          source: ".output/public/*"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 2
          debug: true
