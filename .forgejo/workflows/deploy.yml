name: Deploy Static Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # forgejo-runner를 `--label self-hosted:host`로 띄웠다는 전제 — Docker 없이
    # 러너를 구동하는 서버에서 직접 실행된다(격리 없음). 라벨을 바꿨다면 여기도 맞출 것.
    runs-on: self-hosted
    environment: deploy on aws

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build
        env:
          CMS_API_BASE_URL: "${{ vars.CMS_API_BASE_URL || 'https://tyange.com/api/cms' }}"

      - name: Prepare deploy directory
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          script: |
            mkdir -p "${{ vars.DEPLOY_PATH }}"
            find "${{ vars.DEPLOY_PATH }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Deploy static files via SCP
        uses: https://github.com/appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          source: ".output/public/*"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 2
          debug: true
